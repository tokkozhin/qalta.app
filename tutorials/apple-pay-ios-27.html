<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Pay automation · iOS 27 — Qalta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #000;
      line-height: 1.55;
      padding: 40px 20px 80px;
    }
    .wrap { max-width: 700px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      text-align: left;
      margin-bottom: 32px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      color: inherit;
      text-decoration: none;
    }
    .logo img {
      width: 52px;
      height: auto;
      display: block;
    }
    .title-block {
      display: flex;
      flex-direction: column;
    }
    .brand {
      font-size: 2rem;
      font-weight: 600;
      line-height: 2rem;
      margin: 0;
    }
    .subtitle {
      color: #555;
      font-size: 1rem;
      margin: 0;
    }
    h1 { font-size: 2rem; font-weight: 600; margin: 28px 0 8px; }
    p { margin-bottom: 12px; }
    figure { margin: 28px 0 8px; }
    .player {
      width: min(100%, 360px);
      margin: 0 auto;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      line-height: 0;
    }
    video {
      width: 100%;
      display: block;
      border: 0;
      border-radius: 28px;
      background: #000;
    }
    figcaption {
      color: #555;
      font-size: 0.95rem;
      margin-top: 10px;
      text-align: center;
    }
    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid #000;
      color: #333;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="header-left" href="../index.html">
        <div class="logo">
          <img src="../assets/vector_logo.svg" alt="Qalta App logo" />
        </div>
        <div class="title-block">
          <p class="brand">Qalta App</p>
          <p class="subtitle">AI Expense Tracker</p>
        </div>
      </a>
    </header>

    <h1>Apple Pay automation</h1>
    <p>After an Apple Pay payment, Qalta can save the purchase as a Wallet expense.</p>

    <figure>
      <div class="player">
        <video
          controls
          playsinline
          preload="metadata"
          src="../assets/apple_pay_ios_27_automation.mp4"
          aria-label="Apple Pay automation tutorial for iOS 27 in English"
        ></video>
      </div>
      <figcaption>How to set up an Apple Pay automation on iOS 27.</figcaption>
    </figure>

    <footer>
      <p>© 2026 Qalta</p>
    </footer>
  </div>
</body>
</html>
